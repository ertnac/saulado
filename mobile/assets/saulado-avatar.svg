<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Saulado avatar</title>
  <desc>
    The logo's brain and sparkle on a sage disc. Same two colours as
    saulado.png, so the mark and the avatar read as one family. Used as the
    signed-out placeholder in the app shell.
  </desc>

  <defs>
    <clipPath id="a-disc">
      <circle cx="64" cy="64" r="64" />
    </clipPath>
    <linearGradient id="a-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f0e6" />
      <stop offset="1" stop-color="#cfe0d2" />
    </linearGradient>
  </defs>

  <g clip-path="url(#a-disc)">
    <rect width="128" height="128" fill="url(#a-wash)" />

    <g transform="translate(64 66) scale(0.82) translate(-64 -64)">
      <g fill="#9dbea3">
        <circle cx="44" cy="52" r="24" />
        <circle cx="64" cy="44" r="26" />
        <circle cx="86" cy="52" r="24" />
        <circle cx="34" cy="68" r="20" />
        <circle cx="94" cy="68" r="20" />
        <circle cx="52" cy="78" r="22" />
        <circle cx="78" cy="78" r="22" />
      </g>
      <path
        d="M60 94c1 8 6 11 6 18"
        fill="none"
        stroke="#9dbea3"
        stroke-width="13"
        stroke-linecap="round"
      />
      <g fill="none" stroke="#7fa184" stroke-width="3.2" stroke-linecap="round" opacity="0.85">
        <path d="M30 58c6-6 15-6 20 1" />
        <path d="M46 34c-4 7-3 13 2 17" />
        <path d="M82 32c5 6 6 13 2 18" />
        <path d="M96 58c-6-5-14-4-18 2" />
        <path d="M38 82c5-5 12-5 17 0" />
        <path d="M92 84c-5-5-12-5-17 0" />
      </g>

      <path
        d="M64 34c3 20 12 29 32 32-20 3-29 12-32 32-3-20-12-29-32-32 20-3 29-12 32-32Z"
        fill="#f7b03d"
        stroke="#ee9a1e"
        stroke-width="2.5"
      />
    </g>
  </g>
</svg>
