packages:
  - 'shared'
  - 'backend'
  - 'frontend'
# pnpm 11 moved this out of package.json. These packages need postinstall
# scripts: Prisma downloads its query engine, esbuild its platform binary.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true

overrides:
  '@types/react': '^18.3.18'
  '@types/react-dom': '^18.3.5'
