services:
  db:
    image: postgres:16-alpine
    container_name: saulado-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saulado
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d saulado']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
