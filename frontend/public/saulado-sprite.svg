<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="128" viewBox="0 0 1024 128">
  <title>Saulado brain — 8-frame sprite sheet</title>
  <desc>
    Eight 128x128 frames laid out left to right. The brain breathes and the
    sparkle turns 45 degrees per frame, so the loop closes at frame 8 (360/8
    of the sparkle's 4-fold symmetry lands back on itself). Stepped through with
    background-position; see the .saulado-sprite rules in index.css.
  </desc>

  <defs>
    <g id="s-brain">
      <g fill="#9dbea3">
        <circle cx="44" cy="52" r="24" />
        <circle cx="64" cy="44" r="26" />
        <circle cx="86" cy="52" r="24" />
        <circle cx="34" cy="68" r="20" />
        <circle cx="94" cy="68" r="20" />
        <circle cx="52" cy="78" r="22" />
        <circle cx="78" cy="78" r="22" />
      </g>
      <path d="M60 94c1 8 6 11 6 18" fill="none" stroke="#9dbea3" stroke-width="13" stroke-linecap="round" />
      <g fill="none" stroke="#7fa184" stroke-width="3.2" stroke-linecap="round" opacity="0.85">
        <path d="M30 58c6-6 15-6 20 1" />
        <path d="M46 34c-4 7-3 13 2 17" />
        <path d="M82 32c5 6 6 13 2 18" />
        <path d="M96 58c-6-5-14-4-18 2" />
        <path d="M38 82c5-5 12-5 17 0" />
        <path d="M92 84c-5-5-12-5-17 0" />
      </g>
    </g>

    <path
      id="s-sparkle"
      d="M0-32C3-12 12-3 32 0 12 3 3 12 0 32-3 12-12 3-32 0-12-3-3-12 0-32Z"
      fill="#f7b03d"
      stroke="#ee9a1e"
      stroke-width="2.5"
    />
  </defs>

  <g transform="translate(0 0)">
    <use href="#s-brain" transform="translate(64 64) scale(1) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(0) scale(0.85)" />
  </g>
  <g transform="translate(128 0)">
    <use href="#s-brain" transform="translate(64 64) scale(1.032) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(45) scale(0.991)" />
  </g>
  <g transform="translate(256 0)">
    <use href="#s-brain" transform="translate(64 64) scale(1.045) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(90) scale(1.05)" />
  </g>
  <g transform="translate(384 0)">
    <use href="#s-brain" transform="translate(64 64) scale(1.032) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(135) scale(0.991)" />
  </g>
  <g transform="translate(512 0)">
    <use href="#s-brain" transform="translate(64 64) scale(1) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(180) scale(0.85)" />
  </g>
  <g transform="translate(640 0)">
    <use href="#s-brain" transform="translate(64 64) scale(0.968) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(225) scale(0.709)" />
  </g>
  <g transform="translate(768 0)">
    <use href="#s-brain" transform="translate(64 64) scale(0.955) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(270) scale(0.65)" />
  </g>
  <g transform="translate(896 0)">
    <use href="#s-brain" transform="translate(64 64) scale(0.968) translate(-64 -64)" />
    <use href="#s-sparkle" transform="translate(64 64) rotate(315) scale(0.709)" />
  </g>
</svg>
