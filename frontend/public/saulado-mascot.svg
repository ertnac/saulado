<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200" role="img" aria-label="Saulado mascot — a friendly chibi study buddy">
  <title>Saulado mascot</title>
  <defs>
    <radialGradient id="mg-face" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#ffe8d0"/>
      <stop offset="100%" stop-color="#f5cca8"/>
    </radialGradient>
    <radialGradient id="mg-body" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f7f2e4"/>
      <stop offset="100%" stop-color="#ede3c6"/>
    </radialGradient>
    <radialGradient id="mg-hair" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4a5a35"/>
      <stop offset="100%" stop-color="#2e3a22"/>
    </radialGradient>
    <radialGradient id="mg-shadow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.13)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <path id="mg-star" d="M0-10 C1.1-3.7 3.7-1.1 10 0 3.7 1.1 1.1 3.7 0 10 -1.1 3.7-3.7 1.1-10 0-3.7-1.1-1.1-3.7 0-10Z" fill="#f7b03d" stroke="#ee9a1e" stroke-width="1.2"/>
  </defs>
  <style>
    #mg-root{animation:mg-float 3.2s ease-in-out infinite;transform-origin:80px 100px}
    #mg-shadow-el{animation:mg-shadow-pulse 3.2s ease-in-out infinite;transform-origin:80px 196px}
    #mg-arm-wave{animation:mg-wave 0.6s ease-in-out infinite alternate;transform-origin:116px 148px}
    #mg-head-group{animation:mg-head-sway 3.2s ease-in-out infinite;transform-origin:80px 95px}
    #mg-eyes-open{animation:mg-blink-open 4.5s ease-in-out infinite}
    #mg-eyes-shut{animation:mg-blink-shut 4.5s ease-in-out infinite}
    #mg-ear-left{animation:mg-ear-l 3.2s ease-in-out infinite;transform-origin:43px 108px}
    #mg-ear-right{animation:mg-ear-r 3.2s ease-in-out infinite;transform-origin:117px 108px}
    #mg-sparkle{animation:mg-sparkle-pulse 1.2s ease-in-out infinite alternate;transform-origin:130px 90px}
    #mg-marks{animation:mg-marks-fade 0.6s ease-in-out infinite alternate}
    @keyframes mg-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes mg-shadow-pulse{0%,100%{transform:scaleX(1) scaleY(1);opacity:1}50%{transform:scaleX(.7) scaleY(.7);opacity:.45}}
    @keyframes mg-wave{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
    @keyframes mg-head-sway{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2deg)}}
    @keyframes mg-blink-open{0%,88%,96%,100%{opacity:1}90%,94%{opacity:0}}
    @keyframes mg-blink-shut{0%,88%,96%,100%{opacity:0}90%,94%{opacity:1}}
    @keyframes mg-ear-l{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}
    @keyframes mg-ear-r{0%,100%{transform:rotate(0deg)}30%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}}
    @keyframes mg-sparkle-pulse{from{transform:scale(.8) rotate(0deg);opacity:.7}to{transform:scale(1.3) rotate(18deg);opacity:1}}
    @keyframes mg-marks-fade{from{opacity:.2}to{opacity:.85}}
    @media(prefers-reduced-motion:reduce){
      #mg-root,#mg-shadow-el,#mg-arm-wave,#mg-head-group,
      #mg-eyes-open,#mg-eyes-shut,#mg-ear-left,#mg-ear-right,
      #mg-sparkle,#mg-marks{animation:none}
      #mg-eyes-open{opacity:1}#mg-eyes-shut{opacity:0}
    }
  </style>

  <ellipse id="mg-shadow-el" cx="80" cy="196" rx="38" ry="7" fill="url(#mg-shadow-grad)"/>

  <g id="mg-root">
    <!-- Left resting arm -->
    <rect x="30" y="142" width="18" height="36" rx="9" fill="url(#mg-body)" stroke="#ddd5b2" stroke-width="2"/>
    <ellipse cx="39" cy="180" rx="10" ry="8" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.5"/>

    <!-- Body hoodie -->
    <rect x="38" y="138" width="84" height="55" rx="28" fill="url(#mg-body)" stroke="#ddd5b2" stroke-width="2.2"/>
    <path d="M65 138 Q80 148 95 138" fill="none" stroke="#8dae8e" stroke-width="7" stroke-linecap="round"/>
    <rect x="62" y="162" width="36" height="22" rx="11" fill="none" stroke="#ccc4a6" stroke-width="1.8"/>

    <!-- Waving arm -->
    <g id="mg-arm-wave">
      <rect x="113" y="138" width="18" height="38" rx="9" fill="url(#mg-body)" stroke="#ddd5b2" stroke-width="2"/>
      <rect x="113" y="164" width="18" height="10" rx="5" fill="#8dae8e"/>
      <ellipse cx="122" cy="178" rx="11" ry="9" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.5"/>
      <ellipse cx="115" cy="173" rx="5" ry="4.5" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.2"/>
      <ellipse cx="122" cy="169" rx="5" ry="4.5" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.2"/>
      <ellipse cx="129" cy="173" rx="5" ry="4.5" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.2"/>
    </g>

    <!-- Head group -->
    <g id="mg-head-group">
      <ellipse cx="80" cy="82" rx="40" ry="38" fill="url(#mg-hair)"/>
      <ellipse cx="56" cy="56" rx="15" ry="18" fill="url(#mg-hair)" transform="rotate(-18 56 56)"/>
      <ellipse cx="80" cy="48" rx="13" ry="20" fill="url(#mg-hair)"/>
      <ellipse cx="104" cy="56" rx="15" ry="18" fill="url(#mg-hair)" transform="rotate(18 104 56)"/>

      <ellipse id="mg-ear-left"  cx="43"  cy="98" rx="9" ry="11" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.8"/>
      <ellipse id="mg-ear-right" cx="117" cy="98" rx="9" ry="11" fill="#f5cca8" stroke="#ddb98a" stroke-width="1.8"/>
      <ellipse cx="43"  cy="100" rx="5" ry="6.5" fill="#eda183" opacity=".55"/>
      <ellipse cx="117" cy="100" rx="5" ry="6.5" fill="#eda183" opacity=".55"/>

      <ellipse cx="80" cy="96" rx="36" ry="37" fill="url(#mg-face)"/>

      <ellipse cx="58"  cy="76" rx="13" ry="13" fill="url(#mg-hair)"/>
      <ellipse cx="80"  cy="70" rx="13" ry="11" fill="url(#mg-hair)"/>
      <ellipse cx="102" cy="76" rx="13" ry="13" fill="url(#mg-hair)"/>
      <path d="M55 84 Q58 95 64 90" fill="url(#mg-hair)"/>
      <path d="M105 84 Q102 95 96 90" fill="url(#mg-hair)"/>

      <g id="mg-eyes-open">
        <ellipse cx="67" cy="95" rx="10" ry="11" fill="#fff"/>
        <ellipse cx="93" cy="95" rx="10" ry="11" fill="#fff"/>
        <ellipse cx="67" cy="97" rx="8" ry="9" fill="#4fa870"/>
        <ellipse cx="93" cy="97" rx="8" ry="9" fill="#4fa870"/>
        <ellipse cx="67" cy="98" rx="4.5" ry="5.5" fill="#1f4f34"/>
        <ellipse cx="93" cy="98" rx="4.5" ry="5.5" fill="#1f4f34"/>
        <circle cx="63.5" cy="93" r="2.8" fill="#fff" opacity=".9"/>
        <circle cx="89.5" cy="93" r="2.8" fill="#fff" opacity=".9"/>
        <path d="M57 90 Q67 83 77 90" fill="none" stroke="#2e3a22" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M83 90 Q93 83 103 90" fill="none" stroke="#2e3a22" stroke-width="2.6" stroke-linecap="round"/>
      </g>

      <g id="mg-eyes-shut" opacity="0">
        <path d="M57 95 Q67 106 77 95" fill="none" stroke="#2e3a22" stroke-width="3" stroke-linecap="round"/>
        <path d="M83 95 Q93 106 103 95" fill="none" stroke="#2e3a22" stroke-width="3" stroke-linecap="round"/>
      </g>

      <ellipse cx="54"  cy="108" rx="9" ry="5.5" fill="#eda183" opacity=".5"/>
      <ellipse cx="106" cy="108" rx="9" ry="5.5" fill="#eda183" opacity=".5"/>

      <path d="M70 114 Q80 122 90 114" fill="none" stroke="#7a3330" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="80" cy="117" rx="5" ry="3.5" fill="#c96f6a" opacity=".75"/>
    </g>

    <g id="mg-sparkle">
      <use href="#mg-star" transform="translate(133 84) scale(1.1)"/>
    </g>

    <g id="mg-marks" fill="none" stroke="#f7b03d" stroke-width="2.8" stroke-linecap="round">
      <line x1="104" y1="118" x2="96" y2="112"/>
      <line x1="100" y1="126" x2="90" y2="124"/>
      <line x1="104" y1="134" x2="95" y2="136"/>
    </g>
  </g>
</svg>
