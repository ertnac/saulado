<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saulado</title>
    <meta name="description" content="Learn in Context. Remember for Life." />
    <link rel="icon" type="image/png" href="/saulado.png" />
    <link rel="apple-touch-icon" href="/saulado.png" />
    <meta name="theme-color" content="#f2f8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1714" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!--
      Applies the theme before first paint. Blocking and inline on purpose: doing
      this from React instead means the page paints in the wrong theme and then
      snaps, which is the flash-of-wrong-theme every dark-mode implementation
      trips over. Kept in sync with useTheme.ts — same key, same precedence.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('saulado-theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage unavailable (private mode); fall through to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
